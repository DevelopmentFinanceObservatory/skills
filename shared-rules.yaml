# Rules stated word for word in more than one skill. Some hosts load one skill
# at a time, so each skill carries its own copy of a rule it shares.
# scripts/validate_skills.py fails when the copies differ. Each rule names the
# words its paragraph starts with and every file that holds a copy.
crs-named-donor-total:
  opening: "A total for one named donor read from the CRS"
  files:
    - skills/oda-measures/references/flow-types.md
    - skills/oda-channels/references/sector-imputations.md
    - skills/oda-imputed-multilateral-sectors/SKILL.md
dac2a-named-donor-to-recipient:
  opening: "A named donor's total to a named recipient"
  files:
    - skills/oda-measures/references/flow-types.md
    - skills/oda-dac2a/SKILL.md
oecd-region-readings:
  opening: "Nine regions have an OECD reading"
  files:
    - skills/oda-crs/SKILL.md
    - skills/oda-dac2a/SKILL.md
