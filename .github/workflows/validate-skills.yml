# Validates every skill bundle under skills/ and internal/skills/ on each push to
# dev or main and on each pull request that is ready for review.
#
# The checks live in scripts/validate_skills.py and enforce what CONTRIBUTING.md's
# Format section commits to: the front matter fields, the references/ layout,
# that every pointer from a SKILL.md resolves, and that no reference file is
# left unreachable. Warnings are printed and do not fail the job; anything the
# validator calls an error does.
#
# The validator parses front matter with PyYAML, pinned in
# requirements-dev.txt. A skill author running the same command locally needs
# that one package installed first (pip install -r requirements-dev.txt).
#
# Each skill's attachments.yaml names ontology nodes, so the job also compiles
# the DFO ontology and checks every 'applies_to' entry is a node in it. The
# ontology repository is public, so the job installs it without a token.
# DFO_ONTOLOGY_REF pins the ontology commit the check runs against.
#
# A draft pull request runs no job. `ready_for_review` is in the types so that
# marking it ready starts the run. Without it, the skipped job would stand as a
# passing check on the commit and nothing would have tested it.
name: Validate skills

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

env:
  DFO_ONTOLOGY_REF: afa964e452cc08dbfb3cf11379bbf9a9f32b14f4

jobs:
  validate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test the validator
        run: python -m unittest discover

      - name: Install the DFO ontology compiler
        run: pip install "git+https://github.com/DevelopmentFinanceObservatory/ontology@${DFO_ONTOLOGY_REF}"

      - name: Compile the DFO ontology
        run: dfo-ontology compile --bench prod --output "$RUNNER_TEMP/ontology/dfo.mcf"

      - name: Validate every skill
        run: python scripts/validate_skills.py --ontology-mcf "$RUNNER_TEMP/ontology/dfo.mcf"
